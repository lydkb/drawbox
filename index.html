<head>

  <title>LydKB [drawbox]</title>
<link rel="shortcut icon" href="https://imgur.com/eIKac7n.gif"> 
<link rel="stylesheet" href="https://cursors-4u.net/cursors/animated/cute-ears-doll-girl-9aaba74d-32.css">

<body class="iframe-body">

  <div class="drawbox-tools">
    <label>Brush Size</label>
    <input type="range" id="brushSize" min="1" max="40" value="4">

    <label>Colour</label>
    <input type="color" id="colorPicker" value="#5D536B">

    <button id="undoBtn">Undo</button>
    <button id="clearBtn">Clear</button>
    <button id="submit">Submit</button>
    <span id="status"></span>      
      please keep it family friendly ! ^-^;
  </div>

  <div class="drawbox-canvas-frame">
    <canvas id="drawboxcanvas" width="400" height="400"></canvas>
  </div>

  <div id="gallery" class="drawbox-gallery">Loading images...</div>
 </div>

</body>
<script src="drawbox.js" defer></script>
