<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
content="default-src 'self';
connect-src 'self' https://api.imgur.com https://docs.google.com https://*.google.com https://*.googleusercontent.com;
frame-src 'self' https://docs.google.com;
child-src 'self' https://docs.google.com;
form-action 'self' https://docs.google.com;
img-src 'self' data: https://i.imgur.com https://imgur.com https://*.googleusercontent.com;
style-src 'self' 'unsafe-inline' https://cursors-4u.net https://cdn.cursors-4u.net https://cdnfonts.com https://fonts.cdnfonts.com;
font-src 'self' https://cdnfonts.com https://fonts.cdnfonts.com;">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LydKB [drawbox]</title>
<link rel="shortcut icon" href="https://i.imgur.com/eIKac7n.gif"> 
<link rel="stylesheet" href="https://cdn.cursors-4u.net/cursors/animated/cute-ears-doll-girl-9aaba74d-32.css">
<link rel="preconnect" href="https://fonts.cdnfonts.com">
<link href="https://fonts.cdnfonts.com/css/pixel" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="iframe-body">
    
    
    <div class="box-window drawbox-wrapper" >

  <div class="drawbox-tools">
    <label>Brush Size</label>
    <input type="range" id="brushSize" min="1" max="40">

    <label>Colour</label>
    <input type="color" id="colorPicker" value="#5D536B">

    <button id="undoBtn">Undo</button>
    <button id="clearBtn">Clear</button>
    <button id="submit">Submit</button>
    <span id="status"></span>
      please keep it family friendly ! ^-^;
  </div>

  <div class="drawbox-canvas-frame">
    <canvas id="drawboxcanvas" width="400" height="400"></canvas>
  </div>

  <div id="gallery" class="drawbox-gallery">Loading images...</div>

</div>

    
    <iframe name="google-form-frame" style="display:none;"></iframe>
</body>
    <script src="drawbox.js" defer></script>
    <script src="heartsw.js" defer></script>
</html>
